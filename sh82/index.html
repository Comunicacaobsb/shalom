  <style>
    .hub { display: grid; gap: .75rem; padding-top: 1rem; }
    .hub__card { display: flex; align-items: center; gap: .9rem; min-height: 4.5rem; padding: 1rem 1.1rem; border: 1.5px solid var(--rule); border-radius: 1.1rem;
      background: var(--ink-2); color: var(--bone); text-decoration: none; }
    .hub__card:hover { border-color: var(--y); }
    .hub__txt { flex: 1; min-width: 0; display: grid; gap: .2rem; }
    .hub__nome { font-weight: 900; font-size: 1.15rem; letter-spacing: -.01em; }
    .hub__sit { font-size: .9rem; color: var(--mute); }
    .hub__sit[data-aberto="sim"] { color: var(--ok); font-weight: 700; }
    .hub__card .ic { flex: none; color: var(--y); }
    .hub__card--evento { border-color: var(--ev-cor); background: var(--ev-fundo); color: var(--ev-texto); }
    .hub__card--evento .hub__sit { color: inherit; opacity: .85; }
    .hub__card--evento .ic { color: var(--ev-cor); }
  </style>

  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">

    </div>
  </header>
  <main id="conteudo" tabindex="-1">
    <div id="hub" aria-busy="true">
      <section class="sec"><p class="vazio" role="status">Carregando as lanchonetes…</p></section>
    </div>
    <noscript><p class="falha-carga">Para ver as lanchonetes, ative o JavaScript do navegador.</p></noscript>
  </main>
