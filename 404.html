<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

  <script>
    /* Página de evento ainda não gerada (/<centro>/e/<slug>/): em vez do 404,
       monta aqui mesmo a página de detalhe do centro (evento.html), com os
       dados lidos do Supabase, sem mudar o endereço compartilhado.
       As páginas já geradas por build-event-pages.mjs continuam sendo
       servidas direto (com a og:image delas) e nunca passam por aqui. */
    (function () {
      var m = location.pathname.match(/^\/(asasul|taguatinga|santamaria)\/e\/([a-z0-9][a-z0-9-]{0,80})\/?(?:index\.html)?$/);
      window.__SHALOM_EVENTO_404__ = !!m;
      if (!m) return;
      var centro = m[1], slug = m[2];
      var reserva = "/" + centro + "/evento.html?id=" + encodeURIComponent(slug);
      document.documentElement.style.visibility = "hidden";
      fetch("/" + centro + "/evento.html", { credentials: "same-origin" })
        .then(function (r) { if (!r.ok) throw new Error(String(r.status)); return r.text(); })
        .then(function (html) {
          var head = '<base href="/' + centro + '/">' +
            '<meta name="robots" content="noindex">' +
            '<script>window.__EVENT_ID__=' + JSON.stringify(slug) + ';<\/script>';
          html = html.replace(/<head[^>]*>/i, function (t) { return t + head; });
          document.open();
          document.write(html);
          document.close();
        })
        .catch(function () { location.replace(reserva); });
    })();
    if (!window.__SHALOM_EVENTO_404__) document.write('<script src="/js/header.js"><\/script>');
  </script>

  <meta property="og:site_name" content="Shalom Brasilia">
  <meta property="og:title" content="Shalom Brasilia" />
  <meta property="og:description" content="Pagina nao encontrada">
  <meta property="og:type" content="website" />

  <title>404 — Shalom Brasilia</title>

  <style>
    .error-page {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      text-align: center;
      gap: 0.5rem;
    }
    .error-page h1 {
      font-size: clamp(3rem, 8vw, 5rem);
      font-weight: 800;
      color: var(--brand);
      margin: 0;
    }
    .error-page p {
      color: var(--text-muted);
      margin: 0;
    }
    .error-page a {
      margin-top: 1rem;
    }
  </style>
</head>

<body>

  <div class="error-page">
    <h1>404</h1>
    <p>Pagina nao encontrada</p>
    <a class="btn-brand" href="https://comshalom.org/brasilia/">
      Ir para Home
    </a>
  </div>

  <script>if (!window.__SHALOM_EVENTO_404__) document.write('<script src="/js/footer.js"><\/script>');</script>
</body>

</html>
