name: Atualizar notícias da Asa Sul

on:
  workflow_dispatch:
  schedule:
    - cron: "7 * * * *"

permissions:
  contents: write

concurrency:
  group: asasul-news
  cancel-in-progress: true

jobs:
  update:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Atualizar feed local
        run: python3 scripts/update-asasul-news.py

      - name: Validar feed local
        run: python3 scripts/update-asasul-news.py --check

      - name: Publicar somente o feed alterado
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- asasul/data/noticias.json; then
            echo "Nenhuma alteração no feed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- asasul/data/noticias.json
          git commit -m "chore(asasul): atualiza notícias"
          git push origin HEAD:main
