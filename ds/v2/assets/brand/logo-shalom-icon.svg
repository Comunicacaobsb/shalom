  original, intocado). Processado para o Shalom DS em 15 de agosto de 2026.

  Unica mudanca: o fill fixo #204f8c (antes preso a classe .cls-1) virou
  fill="currentColor" em cada path. A cor agora vem do contexto: de quem usa
  este SVG (herda do componente sh-dove, ver components/surface.css - token de
  camada 2 "sh-dove-ink"). Geometria identica ao original, ponto a ponto:
