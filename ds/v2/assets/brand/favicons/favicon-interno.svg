<?xml version="1.0" encoding="UTF-8"?>
<!--
  Favicon INTERNO — Portal Shalom Brasilia (repositorio privado de
  sistemas). Familia ember: mesma pomba, cor deliberadamente outra, para que
  a aba do Portal nao se confunda com a aba do site publico. Ember e familia
  OFICIAL do DS (a luz e o corpo da pomba no emblema), nao uma cor inventada,
  e nao e tema de evento, ao contrario do dourado do jubileu, que tem data
  para sair.

  GEOMETRIA: identica, ponto a ponto, a assets/brand/logo-shalom-icon.svg
  (que preserva o original oficial). Nenhum atributo d foi alterado. Regra de
  marca (docs/01-identidade.md secao 5): esta pomba NUNCA gira, espelha ou
  inclina.

  POR QUE HEX FIXO, E NAO TOKEN NEM currentColor: um favicon e renderizado
  pelo navegador fora de qualquer arvore de documento. Nao ha elemento pai de
  quem herdar cor, e as custom properties do DS nao existem nesse contexto. A
  unica forma de responder ao esquema do sistema e um bloco style interno com
  a media query prefers-color-scheme. Os dois hex abaixo sao COPIA LITERAL de
  tokens primitivos do DS; se a rampa mudar, este arquivo muda junto (ver
  assets/brand/favicons/README.md).

  CORES E CONTRASTE MEDIDO (WCAG 2.x, calculado, nao estimado):
    claro   #ab4b20  token sh-ember-700   5,59:1 sobre #ffffff | 5,17:1 sobre #f6f6f6 (Safari)
    escuro  #fba32b  token sh-ember-400   7,95:1 sobre #202124 | 6,52:1 sobre #2f3033 (Chrome escuro)
    distancia do favicon publico: dE76 84 (claro) e 92 (escuro), com matiz
    oposta (223 e 190 graus de diferenca). Azul contra laranja e o par que
    sobrevive as deficiencias de visao de cor mais comuns.

  Gerado em 17 de agosto de 2026 para a decisao de distribuicao
  (docs/06-distribuicao.md).
-->
